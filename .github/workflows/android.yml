name: Android build

# Adapted from the Muso app's workflow. Pull requests run the checks; pushes to main, releases
# and manual runs also build a signed APK. The APK attached to a release is what the in-app
# updater (lib/features/update/) offers, so its name must stay CypherAuth-<version>-<build>.apk.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# A newer push supersedes an in-flight build rather than queueing another one.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APK to releases

jobs:
  build:
    name: Check and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app is developed against, so CI and local builds match.
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # The same gate as /verify and scripts/build-apk.ps1. On-device tests (integration_test/)
      # need an emulator and are run locally.
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Offline/security guard: network code only in the updater, telemetry packages, FLAG_SECURE, backup
      # exclusion, pure-Dart OTP core. (Its release-manifest audit runs after the build below.)
      - name: Guard (source)
        run: dart .claude/skills/verify/scripts/guard.dart

      - name: Stop here for pull requests
        if: github.event_name == 'pull_request'
        run: echo "Checks passed. APKs are only built for main, releases and manual runs."

      # The same key as local builds, so a CI APK installs over a local one and vice versa.
      # Secrets are set once in Settings > Secrets and variables > Actions (docs/release.md).
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set. Without them the APK would be debug-signed and could not update an existing install."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        id: build
        if: github.event_name != 'pull_request'
        run: |
          # yyMMddHH in UTC, matching scripts/build-apk.ps1, so builds from either place always
          # install as an upgrade.
          BUILD_NUMBER=$(date -u +%y%m%d%H)
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+[:space:]]+).*/\1/')

          flutter build apk --release --build-number "$BUILD_NUMBER"

          NAME="CypherAuth-$VERSION-$BUILD_NUMBER.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Audits the merged manifest of the build just made: any permission outside the allowlist
      # (CAMERA, USE_BIOMETRIC) fails the job before anything is published.
      - name: Guard (release permissions)
        if: github.event_name != 'pull_request'
        run: dart .claude/skills/verify/scripts/guard.dart

      - name: Remove signing key from the runner
        if: always() && github.event_name != 'pull_request'
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.name }}
          retention-days: 30

      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.name }}" --clobber

      - name: Summarise
        if: success() && github.event_name != 'pull_request'
        run: |
          {
            echo "## CypherAuth APK ready"
            echo ""
            echo "\`${{ steps.build.outputs.name }}\` is attached to this run under **Artifacts**."
            echo ""
            echo "Ref \`${{ github.ref_name }}\` · commit \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
